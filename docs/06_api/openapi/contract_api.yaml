openapi: 3.0.3
info:
  title: Flowance Contracts API
  version: 1.1.0
  description: Phase1 契約API。HOURLY、MONTHLY_RANGE、MONTHLY_FIXED、PERFORMANCE を扱う。同一案件内の契約期間重複は禁止する。
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Contracts
security:
  - accessTokenCookie: []
paths:
  /api/v1/projects/{projectId}/contracts:
    get:
      tags: [Contracts]
      summary: 契約一覧取得
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContractListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Contracts]
      summary: 契約登録
      security:
        - accessTokenCookie: []
          csrfTokenHeader: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractCreateRequest' }
      responses:
        '201': { description: Created, headers: { Location: { description: 作成された契約URL, schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/projects/{projectId}/contracts/{contractId}:
    get:
      tags: [Contracts]
      summary: 契約詳細取得
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contracts]
      summary: 契約更新
      security:
        - accessTokenCookie: []
          csrfTokenHeader: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractUpdateRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Contracts]
      summary: 契約削除
      description: 未確定精算に使用されていない契約のみ削除可能。DELETEではrequestBodyを使わず、versionはquery parameterで受け取る。
      security:
        - accessTokenCookie: []
          csrfTokenHeader: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
components:
  securitySchemes:
    accessTokenCookie: { type: apiKey, in: cookie, name: access_token }
    csrfTokenHeader: { type: apiKey, in: header, name: X-CSRFToken }
  responses:
    BadRequest: { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    UnprocessableEntity: { description: Business rule violation, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, details, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { type: object, additionalProperties: true } }
        traceId: { type: string, format: uuid }
    ContractCreateRequest:
      type: object
      required: [contractType, currency, taxRate, withholdingTaxRate, validFrom]
      properties:
        contractType: { type: string, enum: [HOURLY, MONTHLY_RANGE, MONTHLY_FIXED, PERFORMANCE] }
        currency: { type: string, enum: [JPY] }
        hourlyRate: { type: integer, nullable: true, example: 5000 }
        monthlyRate: { type: integer, nullable: true, example: 800000 }
        performanceFee: { type: integer, nullable: true }
        minimumMinutes: { type: integer, nullable: true, example: 8400 }
        maximumMinutes: { type: integer, nullable: true, example: 10800 }
        baseMinutes: { type: integer, nullable: true, example: 9600 }
        deductionRate: { type: integer, nullable: true, example: 5000 }
        overtimeRate: { type: integer, nullable: true, example: 5000 }
        taxRate: { type: number, format: double, example: 10 }
        withholdingTaxRate: { type: number, format: double, example: 10.21 }
        roundingUnitMinutes: { type: integer, nullable: true, example: 15 }
        roundingMethod: { type: string, enum: [ROUND_DOWN, ROUND_UP, ROUND_HALF_UP], nullable: true }
        closingDay: { type: integer, minimum: 1, maximum: 31, nullable: true, example: 31 }
        paymentTermsDays: { type: integer, minimum: 0, nullable: true, example: 30 }
        validFrom: { type: string, format: date, example: '2026-07-01' }
        validUntil: { type: string, format: date, nullable: true, example: '2026-12-31' }
    ContractUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/ContractCreateRequest' }
        - type: object
          required: [version]
          properties: { version: { type: integer, example: 1 } }
    Contract:
      allOf:
        - { $ref: '#/components/schemas/ContractCreateRequest' }
        - type: object
          required: [id, projectId, version]
          properties:
            id: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            version: { type: integer, example: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ContractListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Contract' } }
