openapi: 3.0.3
info:
  title: Flowance Settings API
  version: 1.0.0
  description: 現在利用者と所属組織の複合設定API
servers:
  - url: http://localhost:8000/api/v1
paths:
  /settings:
    get:
      summary: 設定取得
      operationId: getSettings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 現在の設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: 設定一括・部分更新
      operationId: updateSettings
      description: |
        指定されたセクションだけを同一トランザクションで更新する。
        profileとappearanceはuser versionを共有する。
      security:
        - cookieAuth: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: 更新後の設定全体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
  schemas:
    Profile:
      type: object
      required: [id, email, displayName, lastName, firstName, phone, bio, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 50 }
        firstName: { type: string, maxLength: 50 }
        phone: { type: string, maxLength: 15, pattern: '^[0-9]{0,15}$' }
        bio: { type: string, maxLength: 1000 }
        updatedAt: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, name, timezone, currency, role, canEdit, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        timezone: { type: string, example: Asia/Tokyo }
        currency: { type: string, example: JPY, readOnly: true }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        canEdit: { type: boolean }
        updatedAt: { type: string, format: date-time }
    Business:
      type: object
      required:
        - tradeName
        - postalCode
        - prefecture
        - address
        - canEdit
        - updatedAt
      properties:
        tradeName: { type: string, maxLength: 150 }
        postalCode: { type: string, maxLength: 20 }
        prefecture: { type: string, maxLength: 20 }
        address: { type: string, maxLength: 500 }
        canEdit: { type: boolean }
        updatedAt: { type: string, format: date-time }
    Appearance:
      type: object
      required: [timezone, weekStartsOn, timeFormat, compactMode]
      properties:
        timezone: { type: string, example: Asia/Tokyo }
        weekStartsOn: { type: string, enum: [MONDAY, SUNDAY] }
        timeFormat: { type: string, enum: [H24, H12] }
        compactMode: { type: boolean }
    Versions:
      type: object
      required: [user, organization, business]
      properties:
        user: { type: integer, minimum: 1 }
        organization: { type: integer, minimum: 1 }
        business: { type: integer, minimum: 1 }
    SettingsResponse:
      type: object
      required: [profile, organization, business, appearance, versions, permissions]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        organization: { $ref: '#/components/schemas/Organization' }
        business: { $ref: '#/components/schemas/Business' }
        appearance: { $ref: '#/components/schemas/Appearance' }
        versions: { $ref: '#/components/schemas/Versions' }
        permissions:
          type: array
          items: { type: string }
    ProfileUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        lastName: { type: string, maxLength: 50 }
        firstName: { type: string, maxLength: 50 }
        phone: { type: string, maxLength: 15, pattern: '^[0-9]{0,15}$' }
        bio: { type: string, maxLength: 1000 }
    OrganizationUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        timezone: { type: string, maxLength: 64 }
    BusinessUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        tradeName: { type: string, maxLength: 150 }
        postalCode: { type: string, maxLength: 20 }
        prefecture: { type: string, maxLength: 20 }
        address: { type: string, maxLength: 500 }
    AppearanceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        timezone: { type: string, maxLength: 64 }
        weekStartsOn: { type: string, enum: [MONDAY, SUNDAY] }
        timeFormat: { type: string, enum: [H24, H12] }
        compactMode: { type: boolean }
    SubmittedVersions:
      type: object
      additionalProperties: false
      properties:
        user: { type: integer, minimum: 1 }
        organization: { type: integer, minimum: 1 }
        business: { type: integer, minimum: 1 }
    SettingsUpdateRequest:
      type: object
      minProperties: 2
      additionalProperties: false
      required: [versions]
      properties:
        profile: { $ref: '#/components/schemas/ProfileUpdate' }
        organization: { $ref: '#/components/schemas/OrganizationUpdate' }
        business: { $ref: '#/components/schemas/BusinessUpdate' }
        appearance: { $ref: '#/components/schemas/AppearanceUpdate' }
        versions: { $ref: '#/components/schemas/SubmittedVersions' }
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
        submittedVersion: { type: integer }
        currentVersion: { type: integer }
    ErrorResponse:
      type: object
      required: [code, message, details, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
        traceId: { type: string, format: uuid }
  responses:
    ValidationError:
      description: 入力不正
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 未認証
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 権限またはCSRFエラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: version競合
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

