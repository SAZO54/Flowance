openapi: 3.0.3
info:
  title: Flowance Work Records and Settlements API
  version: 1.1.0
  description: 稼働実績・月次精算 API。actualMinutes / breakMinutes / billableMinutes はバックエンドで計算する。
servers:
  - url: http://localhost:8000
security:
  - accessTokenCookie: []
tags:
  - name: WorkRecords
  - name: Settlements
paths:
  /api/v1/work-records:
    get:
      tags: [WorkRecords]
      summary: 稼働実績一覧取得
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WorkRecordStatus' } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: OK }
    post:
      tags: [WorkRecords]
      summary: 稼働実績登録
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkRecordRequest' }
      responses:
        '201': { description: Created }
  /api/v1/work-records/{recordId}:
    get:
      tags: [WorkRecords]
      summary: 稼働実績詳細取得
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
    patch:
      tags: [WorkRecords]
      summary: 稼働実績更新
      description: Phase1 は DRAFT 中心。DRAFT / CONFIRMED の厳密運用は Phase2 以降。
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkRecordRequest' }
      responses:
        '200': { description: OK }
        '409': { description: Version Conflict }
    delete:
      tags: [WorkRecords]
      summary: 稼働実績取消
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: No Content }
  /api/v1/settlements/calculate:
    post:
      tags: [Settlements]
      summary: 精算計算
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculateSettlementRequest' }
      responses:
        '201': { description: Created }
        '422': { description: Business Rule Violation }
  /api/v1/settlements/{settlementId}:
    get:
      tags: [Settlements]
      summary: 精算詳細取得
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
    delete:
      tags: [Settlements]
      summary: 未確定精算の削除
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: No Content }
  /api/v1/settlements/{settlementId}/recalculate:
    post:
      tags: [Settlements]
      summary: 精算再計算
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer } } }
      responses:
        '200': { description: OK }
  /api/v1/settlements/{settlementId}/finalize:
    post:
      tags: [Settlements]
      summary: 精算確定
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer } } }
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    accessTokenCookie: { type: apiKey, in: cookie, name: access_token }
  schemas:
    WorkRecordStatus: { type: string, enum: [DRAFT, CONFIRMED, CANCELLED] }
    BreakPeriod:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    CreateWorkRecordRequest:
      type: object
      required: [projectId, actualStartAt, actualEndAt, breaks, isBillable, status]
      properties:
        projectId: { type: string, format: uuid }
        workScheduleId: { type: string, format: uuid, nullable: true }
        actualStartAt: { type: string, format: date-time }
        actualEndAt: { type: string, format: date-time }
        breaks:
          type: array
          items: { $ref: '#/components/schemas/BreakPeriod' }
        isBillable: { type: boolean }
        status: { $ref: '#/components/schemas/WorkRecordStatus' }
        notes: { type: string, nullable: true }
    UpdateWorkRecordRequest:
      allOf:
        - $ref: '#/components/schemas/CreateWorkRecordRequest'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    CalculateSettlementRequest:
      type: object
      required: [projectId, settlementMonth, calculationBasis]
      properties:
        projectId: { type: string, format: uuid }
        settlementMonth: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        calculationBasis: { type: string, enum: [ACTUAL, SCHEDULED] }
