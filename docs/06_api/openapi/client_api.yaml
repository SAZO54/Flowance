openapi: 3.0.3
info:
  title: Flowance Clients API
  version: 1.1.0
  description: クライアント API。アイコンは登録 / 更新 API の multipart で扱い、削除は iconAction=DELETE。
servers: [{ url: http://localhost:8000 }]
security: [{ accessTokenCookie: [] }]
paths:
  /api/v1/clients:
    get:
      summary: クライアント一覧取得
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, revenue, -revenue, updatedAt, -updatedAt] } }
      responses: { '200': { description: OK } }
    post:
      summary: クライアント登録
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateClientRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/CreateClientMultipartRequest' } }
      responses: { '201': { description: Created, headers: { Location: { schema: { type: string } } } } }
  /api/v1/clients/{clientId}:
    get:
      summary: クライアント詳細取得
      parameters: [{ name: clientId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }
    patch:
      summary: クライアント更新
      description: iconFileでアイコン更新、iconAction=DELETEで初期アイコンへ戻す。
      parameters: [{ name: clientId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UpdateClientRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/UpdateClientMultipartRequest' } }
      responses: { '200': { description: OK }, '409': { description: Version Conflict } }
    delete:
      summary: クライアント無効化
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses: { '204': { description: No Content } }
components:
  securitySchemes: { accessTokenCookie: { type: apiKey, in: cookie, name: access_token } }
  schemas:
    CreateClientRequest: { type: object, required: [name, status], properties: { name: { type: string, minLength: 1, maxLength: 150 }, contactName: { type: string, maxLength: 100, nullable: true }, email: { type: string, format: email, maxLength: 254, nullable: true }, phone: { type: string, pattern: '^[0-9]{1,15}$', nullable: true }, postalCode: { type: string, maxLength: 20, nullable: true }, address: { type: string, maxLength: 500, nullable: true }, status: { type: string, enum: [ACTIVE, INACTIVE] }, notes: { type: string, maxLength: 1000, nullable: true } } }
    CreateClientMultipartRequest: { allOf: [ { $ref: '#/components/schemas/CreateClientRequest' }, { type: object, properties: { iconFile: { type: string, format: binary, description: JPEG/PNG/WebP、5MB以下、4096px x 4096px以下、16,777,216 pixels以下 } } } ] }
    UpdateClientRequest: { allOf: [ { $ref: '#/components/schemas/CreateClientRequest' }, { type: object, required: [version], properties: { version: { type: integer }, iconAction: { type: string, enum: [KEEP, DELETE] } } } ] }
    UpdateClientMultipartRequest: { allOf: [ { $ref: '#/components/schemas/UpdateClientRequest' }, { type: object, properties: { iconFile: { type: string, format: binary, description: JPEG/PNG/WebP、5MB以下、4096px x 4096px以下、16,777,216 pixels以下 } } } ] }
