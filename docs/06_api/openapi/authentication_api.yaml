openapi: 3.0.3
info:
  title: Flowance Authentication API
  version: 1.1.0
  description: Phase1 認証API。JWTはレスポンス本文に含めず、HttpOnly Cookieで扱う。
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Auth
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 利用者登録
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          headers:
            Set-Cookie: { description: access_token と refresh_token を設定, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthContext' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { description: access_token と refresh_token を設定, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthContext' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/token/refresh:
    post:
      tags: [Auth]
      summary: Token更新
      security:
        - refreshTokenCookie: []
          csrfTokenHeader: []
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { description: access_token と refresh_token を再設定, schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: ログアウト
      security:
        - accessTokenCookie: []
          csrfTokenHeader: []
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: ログイン利用者
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    accessTokenCookie: { type: apiKey, in: cookie, name: access_token }
    refreshTokenCookie: { type: apiKey, in: cookie, name: refresh_token }
    csrfTokenHeader: { type: apiKey, in: header, name: X-CSRFToken }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    VersionQuery: { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    UnprocessableEntity: { description: Business rule violation, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, details, traceId]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: 入力内容を確認してください。 }
        details: { type: array, items: { type: object, additionalProperties: true } }
        traceId: { type: string, format: uuid }
    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages, hasNext, hasPrevious]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalItems: { type: integer, example: 4 }
        totalPages: { type: integer, example: 1 }
        hasNext: { type: boolean, example: false }
        hasPrevious: { type: boolean, example: false }
    Icon:
      type: object
      required: [type, status, url, defaultText, backgroundColor, textColor]
      properties:
        type: { type: string, enum: [DEFAULT, UPLOADED] }
        status: { type: string, enum: [READY, PENDING, FAILED] }
        url: { type: string, format: uri, nullable: true }
        defaultText: { type: string, example: NW }
        backgroundColor: { type: string, example: '#75A8C7' }
        textColor: { type: string, example: '#FFFFFF' }
    TaskAccepted:
      type: object
      required: [taskId, resourceId, status, version]
      properties:
        taskId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED] }
        version: { type: integer, example: 4 }

    RegisterRequest:
      type: object
      required: [email, password, displayName, organizationName, timezone]
      properties:
        email: { type: string, format: email, example: akari@example.com }
        password: { type: string, format: password, minLength: 12, example: secure-password }
        displayName: { type: string, example: 佐藤 あかり }
        organizationName: { type: string, example: Akari Design }
        timezone: { type: string, example: Asia/Tokyo }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: akari@example.com }
        password: { type: string, format: password, example: secure-password }
    AuthUser:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        timezone: { type: string, example: Asia/Tokyo }
    CurrentOrganization:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
    AuthContext:
      type: object
      required: [user, organization]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        organization: { $ref: '#/components/schemas/CurrentOrganization' }
    MeResponse:
      allOf:
        - { $ref: '#/components/schemas/AuthContext' }
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items: { type: string }
              example: [clients:create, projects:create, settlements:finalize]
