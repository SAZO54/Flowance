openapi: 3.0.3
info:
  title: Flowance Settlements API
  version: 1.1.0
  description: Phase1 精算API。一覧取得は主要対象外とし、詳細取得、計算、再計算、確定、未確定精算削除を提供する。
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Settlements
security:
  - accessTokenCookie: []
paths:
  /api/v1/settlements/calculate:
    post:
      tags: [Settlements]
      summary: 精算計算
      security:
        - accessTokenCookie: []
          csrfTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementCalculateRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/settlements/{settlementId}:
    get:
      tags: [Settlements]
      summary: 精算詳細取得
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Settlements]
      summary: 未確定精算の削除
      description: FINALIZEDでは削除不可。DELETEではrequestBodyを使わず、versionはquery parameterで受け取る。
      security:
        - accessTokenCookie: []
          csrfTokenHeader: []
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/settlements/{settlementId}/recalculate:
    post:
      tags: [Settlements]
      summary: 精算再計算
      security:
        - accessTokenCookie: []
          csrfTokenHeader: []
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementVersionRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/settlements/{settlementId}/finalize:
    post:
      tags: [Settlements]
      summary: 精算確定
      security:
        - accessTokenCookie: []
          csrfTokenHeader: []
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementVersionRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementFinalizeResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
components:
  securitySchemes:
    accessTokenCookie: { type: apiKey, in: cookie, name: access_token }
    csrfTokenHeader: { type: apiKey, in: header, name: X-CSRFToken }
  responses:
    BadRequest: { description: Bad Request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Not Found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    UnprocessableEntity: { description: Business rule violation, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, details, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { type: object, additionalProperties: true } }
        traceId: { type: string, format: uuid }
    SettlementCalculateRequest:
      type: object
      required: [projectId, settlementMonth, calculationBasis]
      properties:
        projectId: { type: string, format: uuid }
        settlementMonth: { type: string, pattern: '^\\d{4}-\\d{2}$', example: '2026-07' }
        calculationBasis: { type: string, enum: [ACTUAL, SCHEDULED], example: ACTUAL }
    SettlementVersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, example: 1 }
    Settlement:
      type: object
      required: [id, projectId, contractId, settlementMonth, scheduledMinutes, actualMinutes, billableMinutes, baseAmount, deductionAmount, overtimeAmount, taxAmount, withholdingAmount, totalAmount, status, version]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        settlementMonth: { type: string, example: '2026-07' }
        scheduledMinutes: { type: integer, example: 9600 }
        actualMinutes: { type: integer, example: 11400 }
        billableMinutes: { type: integer, example: 11400 }
        baseAmount: { type: integer, example: 800000 }
        deductionAmount: { type: integer, example: 0 }
        overtimeAmount: { type: integer, example: 50000 }
        taxAmount: { type: integer, example: 85000 }
        withholdingAmount: { type: integer, example: 86785 }
        totalAmount: { type: integer, example: 848215 }
        status: { type: string, enum: [CALCULATED, FINALIZED] }
        version: { type: integer, example: 1 }
    SettlementFinalizeResponse:
      type: object
      required: [id, status, finalizedAt, version]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [FINALIZED] }
        finalizedAt: { type: string, format: date-time }
        version: { type: integer, example: 2 }
